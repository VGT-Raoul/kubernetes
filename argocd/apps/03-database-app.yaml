apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres-database
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/VGT-Raoul/kubernetes
    targetRevision: main
    path: database

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

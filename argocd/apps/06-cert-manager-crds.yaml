apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/part-of: vgt-galaxy-operators
spec:
  project: default

  source:
    repoURL: https://github.com/cert-manager/cert-manager
    targetRevision: v1.21.0
    path: deploy/crds
    directory:
      exclude: "README.md"

  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager

  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true

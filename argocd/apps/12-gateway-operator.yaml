apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-gateway-fabric
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default

  source:
    repoURL: ghcr.io/nginx/charts
    chart: nginx-gateway-fabric
    targetRevision: 2.6.7
    helm:
      skipCrds: true
      values: |
        nginx:
          service:
            type: NodePort
            externalTrafficPolicy: Cluster
            nodePorts:
              - port: 31080
                listenerPort: 80
              - port: 31443
                listenerPort: 443
              # karmada
              - port: 32443
                listenerPort: 5443
              # kafka
              - port: 31092
                listenerPort: 9092

  destination:
    server: https://kubernetes.default.svc
    namespace: nginx-gateway

  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true

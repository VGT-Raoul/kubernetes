apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dapr-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/part-of: vgt-galaxy-operators
spec:
  project: default

  source:
    repoURL: https://dapr.github.io/helm-charts/
    chart: dapr
    targetRevision: 1.18.4
    helm:
      skipCrds: true

  destination:
    server: https://kubernetes.default.svc
    namespace: dapr-system

  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true

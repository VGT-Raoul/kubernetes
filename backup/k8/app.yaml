apiVersion: apps/v1
kind: Deployment
metadata:
  name: items-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: items-app
  template:
    metadata:
      labels:
        app: items-app
    spec:
      containers:
        - name: app
          image: items-app:0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PGHOST
              value: items-db-rw            # the -rw Service name
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: app            # database: from postgres.yaml
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: items-db-app         # the -app Secret
                  key: username          # probably "username"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: items-db-app 
                  key: password          # probably "password"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: items-app
spec:
  selector:
    app: items-app
  ports:
    - port: 80
      targetPort: http

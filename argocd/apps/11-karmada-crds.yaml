apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karmada-operator-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default

  source:
    repoURL: https://github.com/karmada-io/karmada
    targetRevision: v1.17.1
    path: operator/config/crds

  destination:
    server: https://kubernetes.default.svc
    namespace: karmada-operator

  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
